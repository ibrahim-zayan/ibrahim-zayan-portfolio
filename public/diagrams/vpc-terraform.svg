<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="vpcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pubSubGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="privSubGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="518" rx="11" stroke="#334155" stroke-opacity="0.5"/>

  <!-- Header / Meta -->
  <text x="32" y="42" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38bdf8" font-weight="600">AWS ARCHITECTURE // TERRAFORM MANAGED</text>
  <text x="32" y="66" font-family="'Inter', sans-serif" font-size="18" fill="#f8fafc" font-weight="700">Multi-AZ AWS Virtual Private Cloud (10.0.0.0/16)</text>
  <rect x="730" y="28" width="138" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="742" y="47" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">Region: eu-west-1</text>

  <!-- Internet Gateway Header -->
  <g transform="translate(380, 85)">
    <rect width="140" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="600">Internet Gateway</text>
  </g>

  <!-- Line from IGW to VPC -->
  <line x1="450" y1="123" x2="450" y2="155" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- VPC Container Box -->
  <rect x="30" y="155" width="840" height="335" rx="10" fill="url(#vpcGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.7"/>
  <rect x="45" y="142" width="165" height="24" rx="4" fill="#0b1120" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="55" y="158" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b" font-weight="600">VPC: 10.0.0.0/16</text>

  <!-- AZ A Box -->
  <rect x="50" y="180" width="385" height="290" rx="8" fill="#0b1120" fill-opacity="0.6" stroke="#475569" stroke-dasharray="3 3"/>
  <text x="65" y="202" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Availability Zone A (eu-west-1a)</text>

  <!-- AZ A - Public Subnet -->
  <rect x="65" y="220" width="355" height="110" rx="6" fill="url(#pubSubGrad)" stroke="#0284c7" stroke-width="1"/>
  <text x="80" y="242" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="600">Public Subnet (10.0.1.0/24)</text>
  <rect x="80" y="258" width="150" height="55" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="95" y="280" font-family="'Inter', sans-serif" font-size="11" fill="#f1f5f9" font-weight="600">Public Load Balancer</text>
  <text x="95" y="298" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Traffic Ingress</text>

  <rect x="250" y="258" width="150" height="55" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="265" y="280" font-family="'Inter', sans-serif" font-size="11" fill="#f59e0b" font-weight="600">NAT Gateway AZ-a</text>
  <text x="265" y="298" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">EIP Allocated</text>

  <!-- AZ A - Private Subnet -->
  <rect x="65" y="345" width="355" height="110" rx="6" fill="url(#privSubGrad)" stroke="#10b981" stroke-width="1"/>
  <text x="80" y="367" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="600">Private Subnet (10.0.10.0/24)</text>
  <rect x="80" y="380" width="150" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="95" y="403" font-family="'Inter', sans-serif" font-size="11" fill="#f1f5f9" font-weight="600">App Workload (EC2)</text>
  <text x="95" y="423" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">● Isolated Backend</text>

  <rect x="250" y="380" width="150" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="265" y="403" font-family="'Inter', sans-serif" font-size="11" fill="#f1f5f9" font-weight="600">Data Tier (RDS/Store)</text>
  <text x="265" y="423" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Non-routable IP</text>

  <!-- AZ B Box -->
  <rect x="465" y="180" width="385" height="290" rx="8" fill="#0b1120" fill-opacity="0.6" stroke="#475569" stroke-dasharray="3 3"/>
  <text x="480" y="202" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Availability Zone B (eu-west-1b)</text>

  <!-- AZ B - Public Subnet -->
  <rect x="480" y="220" width="355" height="110" rx="6" fill="url(#pubSubGrad)" stroke="#0284c7" stroke-width="1"/>
  <text x="495" y="242" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="600">Public Subnet (10.0.2.0/24)</text>
  <rect x="495" y="258" width="150" height="55" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="510" y="280" font-family="'Inter', sans-serif" font-size="11" fill="#f1f5f9" font-weight="600">Public Standby / ALB</text>
  <text x="510" y="298" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Multi-AZ Failover</text>

  <rect x="665" y="258" width="150" height="55" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="680" y="280" font-family="'Inter', sans-serif" font-size="11" fill="#f1f5f9" font-weight="600">Public Route Table</text>
  <text x="680" y="298" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">0.0.0.0/0 -> IGW</text>

  <!-- AZ B - Private Subnet -->
  <rect x="480" y="345" width="355" height="110" rx="6" fill="url(#privSubGrad)" stroke="#10b981" stroke-width="1"/>
  <text x="495" y="367" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="600">Private Subnet (10.0.20.0/24)</text>
  <rect x="495" y="380" width="150" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="510" y="403" font-family="'Inter', sans-serif" font-size="11" fill="#f1f5f9" font-weight="600">App Workload (EC2)</text>
  <text x="510" y="423" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">● Redundant Node</text>

  <rect x="665" y="380" width="150" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="680" y="403" font-family="'Inter', sans-serif" font-size="11" fill="#f1f5f9" font-weight="600">Private Route Table</text>
  <text x="680" y="423" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b">0.0.0.0/0 -> NAT-GW</text>
</svg>