<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iotBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
  </defs>

  <rect width="920" height="480" rx="12" fill="url(#iotBg)"/>
  <rect x="1" y="1" width="918" height="478" rx="11" stroke="#334155" stroke-opacity="0.5"/>

  <!-- Meta -->
  <text x="32" y="40" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38bdf8" font-weight="600">TELEMETRY PIPELINE // CLOUD INFRASTRUCTURE</text>
  <text x="32" y="65" font-family="'Inter', sans-serif" font-size="18" fill="#f8fafc" font-weight="700">IoT Water Quality Telemetry Ingestion & Storage Architecture</text>

  <!-- Step 1: Edge Sensors -->
  <g transform="translate(30, 130)">
    <rect width="170" height="290" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="85" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="600">EDGE SENSORS</text>
    
    <rect x="15" y="55" width="140" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#f8fafc" font-weight="600">pH Sensor</text>
    <text x="25" y="98" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Analog / ADC</text>

    <rect x="15" y="125" width="140" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="148" font-family="'Inter', sans-serif" font-size="11" fill="#f8fafc" font-weight="600">Turbidity Probe</text>
    <text x="25" y="168" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">NTU Scale</text>

    <rect x="15" y="195" width="140" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="218" font-family="'Inter', sans-serif" font-size="11" fill="#f8fafc" font-weight="600">Temp / TDS</text>
    <text x="25" y="238" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Digital Sensor</text>
  </g>

  <!-- Arrow to Gateway -->
  <path d="M200 270 L250 270" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="250,266 260,270 250,274" fill="#38bdf8"/>
  <text x="230" y="255" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">MQTT / TLS</text>

  <!-- Step 2: AWS IoT Core -->
  <g transform="translate(260, 130)">
    <rect width="180" height="290" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b" font-weight="700">AWS IOT CORE</text>

    <rect x="15" y="55" width="150" height="60" rx="6" fill="#0b1120" stroke="#334155"/>
    <text x="90" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#f8fafc" font-weight="600">Message Broker</text>
    <text x="90" y="98" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">X.509 Auth</text>

    <rect x="15" y="135" width="150" height="125" rx="6" fill="#0b1120" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="90" y="160" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#fbbf24" font-weight="600">IoT Rules Engine</text>
    <text x="25" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">> SQL Query filter</text>
    <text x="25" y="205" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">> Payload validation</text>
    <text x="25" y="225" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">> Multi-destination</text>
  </g>

  <!-- Split paths from Rules Engine -->
  <path d="M440 210 L500 180" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="496,176 508,177 500,186" fill="#f59e0b"/>

  <path d="M440 270 L500 270" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="500,266 510,270 500,274" fill="#38bdf8"/>

  <path d="M440 330 L500 360" stroke="#ef4444" stroke-width="2"/>
  <polygon points="500,354 508,364 496,364" fill="#ef4444"/>

  <!-- Step 3: Cloud Destinations -->
  <!-- Branch 1: Raw Storage -->
  <g transform="translate(510, 130)">
    <rect width="180" height="90" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="600">AMAZON S3</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#f8fafc" font-weight="600">Raw Telemetry Lake</text>
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Partitioned by YYYY/MM/DD</text>
  </g>

  <!-- Branch 2: Serverless Compute -->
  <g transform="translate(510, 230)">
    <rect width="180" height="90" rx="8" fill="#0f172a" stroke="#f59e0b"/>
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b" font-weight="600">AWS LAMBDA</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#f8fafc" font-weight="600">Payload Parser & DB</text>
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Writes clean metrics</text>
  </g>

  <!-- Branch 3: Monitoring & Alarms -->
  <g transform="translate(510, 330)">
    <rect width="180" height="90" rx="8" fill="#0f172a" stroke="#ef4444"/>
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f87171" font-weight="600">CLOUDWATCH</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#f8fafc" font-weight="600">Metric Thresholds</text>
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Alert on high turbidity/pH</text>
  </g>

  <!-- Final step: Notification -->
  <path d="M690 375 L740 375" stroke="#ef4444" stroke-width="2"/>
  <polygon points="740,371 750,375 740,379" fill="#ef4444"/>

  <g transform="translate(750, 330)">
    <rect width="140" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.8"/>
    <text x="15" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f87171" font-weight="600">AMAZON SNS</text>
    <text x="15" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#f8fafc" font-weight="600">Operator Alerts</text>
    <text x="15" y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">SMS & Email dispatch</text>
  </g>
</svg>